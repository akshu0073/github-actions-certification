name: 12 - Working with Outputs

on:
  workflow_dispatch: 
    inputs:
      build-status:
        type: choice
        options: 
         - success
         - failure

jobs:
  build:
    outputs:
      output1: ${{ steps.build.outputs.output1 }}
      output2: ${{ steps.build.outputs.output2 }}
      build-status: ${{ steps.build.outputs.status }}
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_OUTPUT path
        run: echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          echo "GITHUB_OUTPUT"
          echo "status=${{ inputs.build-build-status }}" >> GITHUB_OUTPUT
          echo "output1=value1" >> GITHUB_OUTPUT
          echo "output2=value2" >> GITHUB_OUTPUT
          cat "$GITHUB_OUTPUT"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.outputs.build-status == 'success' }}
    steps:
      - name: Deploy
        run: echo "Deploying"
      - name: print outputs
        run: |
          echo ${{ needs.build.outputs.output1 }}